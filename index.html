<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh yêu em rất nhiều ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 50% 40%, #3a0a24 0%, #1a0512 55%, #08020a 100%);
  }

  /* Canvas hạt/tim bay phía sau */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .stage {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* Trái tim SVG */
  .heart-wrap {
    position: relative;
    width: min(70vmin, 460px);
    aspect-ratio: 1 / 1;
    animation: beat 1.3s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255, 45, 107, 0.65))
            drop-shadow(0 0 80px rgba(255, 45, 107, 0.35));
  }

  .heart-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .heart-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 6%;
    color: #fff;
    font-family: "Dancing Script", "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(2rem, 10vmin, 4.2rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 1px;
    text-shadow: 0 2px 12px rgba(120, 0, 40, 0.65), 0 0 22px rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    user-select: none;
  }

  .heart-text .line2 {
    font-size: 0.8em;
    color: #ffe3ec;
  }

  @keyframes beat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.12); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.08); }
    70%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  .hint {
    position: fixed;
    bottom: 22px;
    width: 100%;
    text-align: center;
    color: rgba(255, 190, 215, 0.55);
    font-size: 0.85rem;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="stage" id="stage">
    <div class="heart-wrap">
      <svg viewBox="0 0 512 460" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0.8" y2="1">
            <stop offset="0%"  stop-color="#ff6b9a"/>
            <stop offset="55%" stop-color="#ff1f5a"/>
            <stop offset="100%" stop-color="#b3003c"/>
          </linearGradient>
          <radialGradient id="shine" cx="30%" cy="25%" r="45%">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path id="heartPath" fill="url(#g)"
          d="M256 440 C 60 300, 0 200, 0 130 C 0 55, 55 5, 125 5
             C 178 5, 228 35, 256 85 C 284 35, 334 5, 387 5
             C 457 5, 512 55, 512 130 C 512 200, 452 300, 256 440 Z"/>
        <path fill="url(#shine)"
          d="M256 440 C 60 300, 0 200, 0 130 C 0 55, 55 5, 125 5
             C 178 5, 228 35, 256 85 C 284 35, 334 5, 387 5
             C 457 5, 512 55, 512 130 C 512 200, 452 300, 256 440 Z"/>
      </svg>
      <div class="heart-text">
        <span>Anh yêu em</span>
        <span class="line2">rất nhiều</span>
      </div>
    </div>
  </div>

  <div class="hint">Chạm vào màn hình để thả tim ❤</div>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = ['#ff2d6b', '#ff6b9a', '#ff9ebc', '#ffc2d6', '#ff4d88', '#ffffff'];
  const hearts = [];

  // Vẽ một trái tim nhỏ tại (0,0) với kích thước s
  function drawHeart(x, y, s, color, alpha, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s / 32, s / 32);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.bezierCurveTo(-24, -6, -14, -26, 0, -12);
    ctx.bezierCurveTo(14, -26, 24, -6, 0, 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function spawn(x, y, burst) {
    const size = 8 + Math.random() * 22;
    hearts.push({
      x: x ?? Math.random() * W,
      y: y ?? H + size,
      size,
      vx: burst ? (Math.random() - 0.5) * 5 : (Math.random() - 0.5) * 0.6,
      vy: burst ? -(1.5 + Math.random() * 4) : -(0.6 + Math.random() * 1.4),
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.01 + Math.random() * 0.03,
      rot: (Math.random() - 0.5) * 0.8,
      color: colors[(Math.random() * colors.length) | 0],
      alpha: 0.35 + Math.random() * 0.55,
      life: 1
    });
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);

    if (Math.random() < 0.12) spawn();

    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.sway += h.swaySpeed;
      h.x += h.vx + Math.sin(h.sway) * 0.5;
      h.y += h.vy;
      h.vx *= 0.995;
      if (h.y < H * 0.1) h.life -= 0.012;
      if (h.y < -40 || h.life <= 0) { hearts.splice(i, 1); continue; }
      drawHeart(h.x, h.y, h.size, h.color, h.alpha * Math.max(h.life, 0), h.rot + Math.sin(h.sway) * 0.15);
    }
    requestAnimationFrame(tick);
  }
  tick();

  // Chạm / click để thả một chùm tim
  function burst(e) {
    const p = e.touches ? e.touches[0] : e;
    for (let i = 0; i < 14; i++) spawn(p.clientX, p.clientY, true);
  }
  stage.addEventListener('click', burst);
  stage.addEventListener('touchstart', burst, { passive: true });

  // Ban đầu: rải sẵn một ít tim
  for (let i = 0; i < 18; i++) spawn(Math.random() * W, Math.random() * H);
})();
</script>
<script src="music.js"></script>
</body>
</html>
