<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh yêu em rất nhiều ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, #2a0a3d 0%, #10041c 60%, #05010b 100%);
  }

  .wrap {
    position: relative;
    width: min(78vmin, 520px);
    aspect-ratio: 512 / 460;
    max-width: 92vw;
  }
  /* Quầng sáng phía sau, nhấp nháy theo nhịp */
  .wrap::before {
    content: ""; position: absolute; inset: -20%;
    background: radial-gradient(circle, rgba(255, 47, 143, .28) 0%, rgba(255, 47, 143, 0) 62%);
    animation: halo 2.4s ease-in-out 3s infinite;
    opacity: 0;
  }
  svg { position: relative; width: 100%; height: 100%; overflow: visible; display: block; }

  .tube {
    fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 2.8s cubic-bezier(.6, .1, .3, 1) forwards, hum 2.4s ease-in-out 3.2s infinite;
  }
  .outer {
    stroke: #ff2f8f; stroke-width: 7;
    filter: drop-shadow(0 0 5px #ff2f8f) drop-shadow(0 0 16px #ff2f8f) drop-shadow(0 0 34px #ff2f8f);
  }
  .inner {
    stroke: #7df9ff; stroke-width: 3.5; animation-delay: .9s, 3.2s;
    filter: drop-shadow(0 0 4px #7df9ff) drop-shadow(0 0 12px #3ac8ff);
  }

  .neon-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 5%;
    font-family: "Dancing Script", "Brush Script MT", "Segoe Script", cursive;
    font-weight: 700; text-align: center; line-height: 1.15; white-space: nowrap;
    font-size: clamp(1.9rem, 9vmin, 3.8rem);
    color: #fff0f7;
    text-shadow: 0 0 4px #fff, 0 0 10px #ff2f8f, 0 0 22px #ff2f8f, 0 0 46px #ff2f8f, 0 0 80px #ff2f8f;
    opacity: 0;
    animation: flicker 2.2s linear 2.4s forwards;
  }
  .neon-text small { font-size: .78em; color: #c8f9ff;
    text-shadow: 0 0 4px #fff, 0 0 10px #3ac8ff, 0 0 22px #3ac8ff, 0 0 46px #3ac8ff; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes hum  { 0%, 100% { opacity: 1; } 50% { opacity: .82; } }
  @keyframes halo { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes flicker {
    0%   { opacity: 0; }
    6%   { opacity: .9; }
    9%   { opacity: .1; }
    14%  { opacity: 1; }
    18%  { opacity: .3; }
    22%  { opacity: 1; }
    30%  { opacity: .6; }
    36%  { opacity: 1; }
    100% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tube { animation: none; stroke-dashoffset: 0; }
    .neon-text { animation: none; opacity: 1; }
    .wrap::before { animation: none; opacity: .8; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 512 460" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path class="tube outer" pathLength="1"
        d="M256 440 C 60 300, 0 200, 0 130 C 0 55, 55 5, 125 5
           C 178 5, 228 35, 256 85 C 284 35, 334 5, 387 5
           C 457 5, 512 55, 512 130 C 512 200, 452 300, 256 440 Z"/>
      <path class="tube inner" pathLength="1"
        transform="translate(256 222) scale(.8) translate(-256 -222)"
        d="M256 440 C 60 300, 0 200, 0 130 C 0 55, 55 5, 125 5
           C 178 5, 228 35, 256 85 C 284 35, 334 5, 387 5
           C 457 5, 512 55, 512 130 C 512 200, 452 300, 256 440 Z"/>
    </svg>
    <div class="neon-text"><span>Anh yêu em</span><small>rất nhiều</small></div>
  </div>
<script src="music.js"></script>
</body>
</html>
