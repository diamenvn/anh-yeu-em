<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh yêu em rất nhiều ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a020e; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .msg {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 3vmin;
    pointer-events: none; user-select: none;
    font-family: "Dancing Script", "Brush Script MT", "Segoe Script", cursive;
    font-weight: 700; color: #fff; text-align: center; line-height: 1.15;
    font-size: clamp(2rem, 9vmin, 4rem);
    text-shadow: 0 0 18px rgba(255, 60, 120, .9), 0 0 40px rgba(255, 60, 120, .6);
  }
  .msg small { font-size: .75em; color: #ffd6e5; }
  .hint {
    position: fixed; bottom: 18px; width: 100%; text-align: center;
    color: rgba(255, 190, 215, .55); font: .85rem "Segoe UI", Arial, sans-serif;
    letter-spacing: 1px; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="msg"><span>Anh yêu em</span><small>rất nhiều</small></div>
<div class="hint">Rê chuột / chạm vào để làm tim vỡ ra ❤</div>

<script>
(() => {
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  let W, H, P = [], t = 0;
  const m = { x: -9999, y: -9999 };

  // Phương trình trái tim
  const hp = a => ({
    x: 16 * Math.sin(a) ** 3,
    y: -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a))
  });

  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = Math.min(W, H) / 36;
    const N = W < 600 ? 1600 : 2800;
    P = [];
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2;
      const edge = Math.random() < 0.45;
      const r = edge ? 0.96 + Math.random() * 0.06 : Math.sqrt(Math.random()) * 0.95;
      const q = hp(a);
      P.push({
        hx: q.x * r * s,
        hy: (q.y * r - 2.5) * s,
        x: Math.random() * W, y: Math.random() * H,
        vx: 0, vy: 0,
        s: (edge ? 1.8 : 1.3) + Math.random() * 1.2,
        ph: Math.random() * 6.28,
        col: `hsl(${330 + Math.random() * 28}, 100%, ${58 + Math.random() * 32}%)`
      });
    }
  }

  function loop() {
    t += 0.016;
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(10,2,14,.28)';
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';

    const b = Math.pow((Math.sin(t * 2.6) + 1) / 2, 7);   // nhịp đập
    const sc = 1 + 0.09 * b;
    const cx = W / 2, cy = H / 2;
    g.globalAlpha = 0.6 + 0.4 * b;

    for (const p of P) {
      const tx = cx + p.hx * sc + Math.sin(t * 2 + p.ph) * 1.2;
      const ty = cy + p.hy * sc + Math.cos(t * 2 + p.ph) * 1.2;
      let ax = (tx - p.x) * 0.04, ay = (ty - p.y) * 0.04;
      const dx = p.x - m.x, dy = p.y - m.y, d = dx * dx + dy * dy;
      if (d < 14000) {
        const f = (1 - d / 14000) * 6, dd = Math.sqrt(d) || 1;
        ax += dx / dd * f; ay += dy / dd * f;
      }
      p.vx = (p.vx + ax) * 0.86;
      p.vy = (p.vy + ay) * 0.86;
      p.x += p.vx; p.y += p.vy;
      g.fillStyle = p.col;
      g.fillRect(p.x, p.y, p.s, p.s);
    }
    requestAnimationFrame(loop);
  }

  addEventListener('pointermove', e => { m.x = e.clientX; m.y = e.clientY; });
  addEventListener('pointerleave', () => { m.x = m.y = -9999; });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') m.x = m.y = -9999; });
  addEventListener('pointerdown', e => {
    for (const p of P) {
      const dx = p.x - e.clientX, dy = p.y - e.clientY;
      if (dx * dx + dy * dy < 40000) {
        const a = Math.random() * 6.28, f = 6 + Math.random() * 14;
        p.vx += Math.cos(a) * f; p.vy += Math.sin(a) * f;
      }
    }
  });
  addEventListener('resize', build);

  build();
  loop();
})();
</script>
<script src="music.js"></script>
</body>
</html>
